; ClipPipeline queue worker (item 6).
; Copy to /etc/supervisor/conf.d/clippipeline-worker.conf and adjust the paths/user.
;
;   sudo cp deploy/supervisor-clippipeline-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start clippipeline-worker:*

[program:clippipeline-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/clippipeline/artisan queue:work --queue=default --tries=3 --timeout=300 --sleep=3 --max-time=3600
directory=/var/www/clippipeline
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/clippipeline/storage/logs/worker.log
stopwaitsecs=330
